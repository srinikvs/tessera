# SPA fallback so /tessera/play (and any other client route) serves the app.
# Never cache index.html — phones were stuck on a stale JS bundle after a line clear.
location = /tessera/index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
}

location /tessera/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location /tessera/ {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files $uri $uri/ /tessera/index.html;
}
